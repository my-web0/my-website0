<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXE BOX</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }
    body {
      background-color: #09090b;
      color: #ffffff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: rgba(9, 9, 11, 0.9);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #D4AF37;
    }
    .delivery-info {
      color: #cccccc;
      font-size: 14px;
    }
    .hero {
      text-align: center;
      padding: 80px 20px;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background-color: rgba(212, 175, 55, 0.1);
      border: 1px solid #D4AF37;
      color: #D4AF37;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 15px;
    }
    .hero h1 {
      font-size: 50px;
      color: #D4AF37;
      margin: 15px 0;
    }
    .hero h2 {
      font-weight: 300;
      color: #cccccc;
      margin-bottom: 10px;
    }
    .hero p {
      color: #888888;
      margin-bottom: 25px;
    }
    .btn-hero {
      display: inline-block;
      padding: 15px 30px;
      background-color: #D4AF37;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
    }
    .packs-section {
      padding: 60px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .packs-section h2 {
      font-size: 36px;
      color: #ffffff;
      margin-bottom: 40px;
      text-align: center;
    }
    .packs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }
    .card {
      background-color: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }
    .card-body {
      padding: 20px;
    }
    .card-title {
      font-size: 22px;
      color: #D4AF37;
      margin-bottom: 5px;
    }
    .card-subtitle {
      font-size: 14px;
      color: #cccccc;
      margin-bottom: 15px;
    }
    .card-price {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 15px;
    }
    .btn-buy {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: transparent;
      border: 1px solid #D4AF37;
      color: #D4AF37;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      border-radius: 4px;
      transition: 0.3s;
    }
    .btn-buy:hover {
      background-color: #D4AF37;
      color: #000;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">LUXE BOX</div>
    <div class="delivery-info">Livraison Gratuite partout au Maroc</div>
  </header>

  <section class="hero">
    <div class="badge">L'élégance à portée de main</div>
    <h1>LUXE BOX</h1>
    <h2>Votre signature. Votre style.</h2>
    <p>Découvrez nos 4 coffrets exclusifs de bijoux et accessoires.</p>
    <a href="#packs-container" class="btn-hero">Découvrir les Coffrets - 199 DH</a>
  </section>

  <section class="packs-section">
    <h2>La Collection</h2>
    <div id="packs-container" class="packs-grid"></div>
  </section>

  <script>
    const packs = [
      { id: 1, name: "Black & Gold", subtitle: "L'Élégance Absolue", image: "./pack1.jpeg", price: 199 },
      { id: 2, name: "Pink Romance", subtitle: "La Douceur Incarnée", image: "./pack2.jpeg", price: 199 },
      { id: 3, name: "Red Passion", subtitle: "L'Audace Captivante", image: "./pack3.jpeg", price: 199 },
      { id: 4, name: "White Elegance", subtitle: "La Pureté Intemporelle", image: "./pack4.jpeg", price: 199 }
    ];

    const container = document.getElementById('packs-container');

    packs.forEach(pack => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${pack.image}" alt="${pack.name}">
        <div class="card-body">
          <h3 class="card-title">${pack.name}</h3>
          <p class="card-subtitle">${pack.subtitle}</p>
          <p class="card-price">${pack.price} DH</p>
          <button class="btn-buy" onclick="orderPack('${pack.name}')">Commander sur WhatsApp</button>
        </div>
      `;
      container.appendChild(card);
    });

    function orderPack(packName) {
      const message = `Bonjour, je souhaite commander le coffret *${packName}* à 199 DH.`;
      window.open(`https://wa.me/212720394141?text=${encodeURIComponent(message)}`, '_blank');
    }
  </script>

</body>
</html>
